<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {{#page.title}}{{page.title}} &mdash; {{/page.title}}{{site.title}}
    </title>
    {{#page.excerpt}}
    <meta name="description" content="{{page.excerpt}}">
    {{/page.excerpt}}
    <link rel="stylesheet" href="{{site.baseurl}}/css/main.css">
    <link rel="canonical" href="{{site.url}}{{page.url}}">
    <link
      rel="alternate"
      type="application/atom+xml"
      title="{{site.title}}"
      href="{{site.url}}/atom.xml"
    >
    <link href="{{site.baseurl}}/favicon.png" rel="icon">
  </head>
  <body>
    <header>
      <h1><a href="{{site.baseurl}}/">{{site.title}}</a></h1>
    </header>

    {{& content}}

    <footer>{{site.title}} &copy; {{site.year}} {{site.author}}</footer>
  </body>
</html>
