---
layout: default
---
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <header>
    <h1 itemprop="name headline"><a href="{{page.url}}">{{page.title}}</a></h1>
    <p>投稿日: <time datetime="{{page.dateIso}}" itemprop="datePublished">{{page.dateDisplay}}</time></p>
  </header>
  <div itemprop="articleBody">
    {{& content}}
  </div>
</article>
