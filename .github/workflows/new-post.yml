name: New Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "URL slug (ASCII only, e.g. my-post-title)"
        required: true
      title:
        description: "Post title (optional, defaults to slug)"
        required: false

jobs:
  new-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Create branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "post/${{ github.event.inputs.slug }}"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Create post
        run: |
          if [ -n "${{ github.event.inputs.title }}" ]; then
            deno task new-post "${{ github.event.inputs.slug }}" "${{ github.event.inputs.title }}"
          else
            deno task new-post "${{ github.event.inputs.slug }}"
          fi

      - name: Commit and push
        run: |
          git add src/blog/
          git commit -m "Add post: ${{ github.event.inputs.slug }}"
          git push -u origin "post/${{ github.event.inputs.slug }}"

      - name: Add summary links
        run: |
          FILE=$(git diff-tree --no-commit-id -r --name-only HEAD | grep '\.md$')
          BRANCH="post/${{ github.event.inputs.slug }}"
          REPO="${{ github.repository }}"
          echo "# Post file" >> $GITHUB_STEP_SUMMARY
          echo "- [View on GitHub](https://github.com/${REPO}/blob/${BRANCH}/${FILE})" >> $GITHUB_STEP_SUMMARY
          echo "- [Edit on github.dev](https://github.dev/${REPO}/blob/${BRANCH}/${FILE})" >> $GITHUB_STEP_SUMMARY

      - name: Build
        run: deno task build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=k-ui-jp
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        run: |
          gh pr create \
            --title "投稿: ${{ github.event.inputs.title || github.event.inputs.slug }}" \
            --body "" \
            --base master \
            --head "post/${{ github.event.inputs.slug }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
