name: CI and Deploy

on:
  push:
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Format check
        if: "!startsWith(github.ref, 'refs/heads/post/')"
        run: deno fmt --check

      - name: Format and auto-commit
        if: startsWith(github.ref, 'refs/heads/post/')
        run: |
          deno fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply deno fmt"
            git push
          fi

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Build
        run: deno task build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/post/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=k-ui-jp
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
